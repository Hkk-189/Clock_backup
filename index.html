<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#020711">
    <title>AI IGNITE — Hackathon Timer</title>

    <style>
        /* =========================================================
           AI IGNITE — FUTURISTIC HACKATHON TIMER
           ========================================================= */

        :root {
            --bg: #020711;
            --bg-deep: #01040a;
            --cyan: #00eaff;
            --blue: #258cff;
            --purple: #8b5cf6;
            --green: #36f5a0;
            --danger: #ff3b81;
            --text: #e9fcff;
            --muted: #6c8997;

            --glass: rgba(7, 20, 34, 0.58);
            --glass-border: rgba(0, 234, 255, 0.22);

            --timer-size: clamp(4rem, 12vw, 11.5rem);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at 50% 45%,
                    rgba(0, 150, 255, 0.10) 0%,
                    rgba(0, 70, 150, 0.05) 28%,
                    transparent 62%
                ),
                radial-gradient(
                    circle at 15% 20%,
                    rgba(139, 92, 246, 0.08),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(0, 234, 255, 0.06),
                    transparent 35%
                ),
                var(--bg);

            color: var(--text);
            font-family:
                "Courier New",
                "Lucida Console",
                Monaco,
                Consolas,
                monospace;

            position: relative;
            isolation: isolate;
        }

        /* =========================================================
           BACKGROUND
           ========================================================= */

        .background {
            position: fixed;
            inset: 0;
            z-index: -10;
            overflow: hidden;
            pointer-events: none;
        }

        /* Digital grid */
        .grid {
            position: absolute;
            inset: -10%;
            background-image:
                linear-gradient(rgba(0, 234, 255, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 234, 255, 0.035) 1px, transparent 1px);
            background-size: 55px 55px;
            transform: perspective(800px) rotateX(58deg) scale(1.5);
            transform-origin: center bottom;
            opacity: 0.55;
            animation: gridMove 18s linear infinite;
        }

        @keyframes gridMove {
            from {
                transform: perspective(800px) rotateX(58deg) scale(1.5)
                    translateY(0);
            }

            to {
                transform: perspective(800px) rotateX(58deg) scale(1.5)
                    translateY(55px);
            }
        }

        /* Atmospheric glow */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.16;
            animation: orbFloat 12s ease-in-out infinite alternate;
        }

        .orb.one {
            width: 38vw;
            height: 38vw;
            top: -18vw;
            left: -12vw;
            background: #0077ff;
        }

        .orb.two {
            width: 35vw;
            height: 35vw;
            right: -12vw;
            bottom: -18vw;
            background: #702cff;
            animation-delay: -4s;
        }

        .orb.three {
            width: 25vw;
            height: 25vw;
            left: 38%;
            top: 35%;
            background: #00eaff;
            opacity: 0.05;
            animation-delay: -8s;
        }

        @keyframes orbFloat {
            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(35px, -25px) scale(1.08);
            }
        }

        /* Scanlines */
        .scanlines {
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0,
                transparent 3px,
                rgba(255, 255, 255, 0.012) 4px
            );
            opacity: 0.5;
        }

        /* Vignette */
        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(
                ellipse at center,
                transparent 45%,
                rgba(0, 0, 0, 0.65) 100%
            );
        }

        /* Circuit lines */
        .circuits {
            position: absolute;
            inset: 0;
            opacity: 0.22;
        }

        .circuit {
            position: absolute;
            height: 1px;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(0, 234, 255, 0.55),
                transparent
            );
            box-shadow: 0 0 8px rgba(0, 234, 255, 0.4);
        }

        .circuit::after {
            content: "";
            position: absolute;
            width: 5px;
            height: 5px;
            right: 22%;
            top: -2px;
            border-radius: 50%;
            background: var(--cyan);
            box-shadow: 0 0 10px var(--cyan);
        }

        .circuit.c1 {
            width: 28%;
            top: 18%;
            left: 0;
        }

        .circuit.c2 {
            width: 22%;
            top: 73%;
            right: 0;
            transform: rotate(-3deg);
        }

        .circuit.c3 {
            width: 18%;
            top: 33%;
            right: 0;
            transform: rotate(5deg);
        }

        .circuit.c4 {
            width: 24%;
            bottom: 16%;
            left: 0;
            transform: rotate(2deg);
        }

        /* Particle canvas */
        #particles {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        /* =========================================================
           MAIN LAYOUT
           ========================================================= */

        .app {
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding: clamp(28px, 5vh, 60px) 24px 28px;
        }

        /* =========================================================
           TOP LOGO
           ========================================================= */

        .brand {
            position: relative;
            text-align: center;
            z-index: 5;
            user-select: none;
        }

        .brand::before,
        .brand::after {
            content: "";
            position: absolute;
            top: 50%;
            width: clamp(40px, 8vw, 120px);
            height: 1px;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(0, 234, 255, 0.7)
            );
        }

        .brand::before {
            right: calc(100% + 20px);
        }

        .brand::after {
            left: calc(100% + 20px);
            transform: rotate(180deg);
        }

        .brand-name {
            font-size: clamp(2.8rem, 7vw, 5.2rem);
            font-weight: 700;
            letter-spacing: 0.45em;
            padding-left: 0.45em;
            color: #eaffff;
            text-shadow:
                0 0 8px rgba(0, 234, 255, 0.9),
                0 0 25px rgba(0, 130, 255, 0.5);
        }

        .brand-tag {
            margin-top: 7px;
            font-size: 0.52rem;
            letter-spacing: 0.35em;
            padding-left: 0.35em;
            color: rgba(0, 234, 255, 0.55);
        }

        /* =========================================================
           TIMER AREA
           ========================================================= */

        .timer-zone {
            flex: 1;
            width: min(1400px, 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* HUD frame around timer */
        .timer-frame {
            position: relative;
            width: min(1200px, 95vw);
            padding: clamp(32px, 6vw, 80px) clamp(20px, 5vw, 80px);
            border: 1px solid rgba(0, 234, 255, 0.12);
            background: linear-gradient(
                135deg,
                rgba(0, 234, 255, 0.025),
                rgba(79, 42, 150, 0.025)
            );
            box-shadow:
                inset 0 0 80px rgba(0, 120, 255, 0.025),
                0 0 80px rgba(0, 100, 255, 0.025);
        }

        .timer-frame::before,
        .timer-frame::after {
            content: "";
            position: absolute;
            width: 45px;
            height: 45px;
            border-color: rgba(0, 234, 255, 0.7);
            border-style: solid;
            pointer-events: none;
        }

        .timer-frame::before {
            top: -1px;
            left: -1px;
            border-width: 2px 0 0 2px;
        }

        .timer-frame::after {
            right: -1px;
            bottom: -1px;
            border-width: 0 2px 2px 0;
        }

        .hud-label {
            text-align: center;
            font-size: clamp(0.48rem, 1vw, 0.68rem);
            letter-spacing: 0.4em;
            padding-left: 0.4em;
            color: rgba(0, 234, 255, 0.42);
            margin-bottom: clamp(18px, 3vh, 34px);
        }

        .timer {
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            user-select: none;
            line-height: 0.9;
            animation: timerBreath 4s ease-in-out infinite;
        }

        .timer.running {
            animation-duration: 3s;
        }

        .timer.urgent {
            animation:
                urgentPulse 0.9s ease-in-out infinite alternate;
        }

        @keyframes timerBreath {
            0%,
            100% {
                filter:
                    drop-shadow(0 0 8px rgba(0, 234, 255, 0.5))
                    drop-shadow(0 0 25px rgba(0, 120, 255, 0.25));
            }

            50% {
                filter:
                    drop-shadow(0 0 15px rgba(0, 234, 255, 0.7))
                    drop-shadow(0 0 40px rgba(0, 120, 255, 0.32));
            }
        }

        @keyframes urgentPulse {
            from {
                filter:
                    drop-shadow(0 0 12px rgba(255, 59, 129, 0.55))
                    drop-shadow(0 0 28px rgba(139, 92, 246, 0.35));
            }

            to {
                filter:
                    drop-shadow(0 0 22px rgba(255, 59, 129, 0.9))
                    drop-shadow(0 0 50px rgba(139, 92, 246, 0.55));
            }
        }

        .time-value {
            font-size: var(--timer-size);
            font-weight: 700;
            letter-spacing: 0.035em;
            color: #eaffff;
            text-shadow:
                0 0 4px rgba(255, 255, 255, 0.9),
                0 0 15px rgba(0, 234, 255, 0.95),
                0 0 38px rgba(0, 130, 255, 0.65),
                0 0 75px rgba(100, 50, 255, 0.25);
        }

        .separator {
            display: inline-block;
            font-size: calc(var(--timer-size) * 0.78);
            font-weight: 400;
            color: var(--cyan);
            margin: 0 clamp(8px, 1.6vw, 25px);
            transform: translateY(-0.03em);
            text-shadow:
                0 0 10px rgba(0, 234, 255, 0.9),
                0 0 30px rgba(0, 130, 255, 0.55);
            animation: colonPulse 1s ease-in-out infinite;
        }

        @keyframes colonPulse {
            0%,
            45%,
            100% {
                opacity: 1;
            }

            50%,
            95% {
                opacity: 0.35;
            }
        }

        .timer.urgent .time-value {
            color: #fff1f7;
            text-shadow:
                0 0 5px #fff,
                0 0 16px rgba(255, 59, 129, 1),
                0 0 38px rgba(255, 59, 129, 0.7),
                0 0 80px rgba(139, 92, 246, 0.5);
        }

        .timer.urgent .separator {
            color: #ff8ab4;
        }

        /* =========================================================
           STATUS
           ========================================================= */

        .status-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: clamp(24px, 4vh, 40px);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--cyan);
            box-shadow:
                0 0 8px var(--cyan),
                0 0 18px rgba(0, 234, 255, 0.65);
            animation: statusPulse 2s ease-in-out infinite;
        }

        @keyframes statusPulse {
            0%,
            100% {
                opacity: 0.5;
                transform: scale(0.8);
            }

            50% {
                opacity: 1;
                transform: scale(1.15);
            }
        }

        .status {
            font-size: clamp(0.62rem, 1.3vw, 0.85rem);
            font-weight: 700;
            letter-spacing: 0.28em;
            padding-left: 0.28em;
            color: rgba(220, 250, 255, 0.76);
            text-align: center;
        }

        .status.completed {
            color: #ff83b0;
            text-shadow: 0 0 12px rgba(255, 59, 129, 0.55);
        }

        .status.completed + .status-dot {
            background: var(--danger);
            box-shadow:
                0 0 8px var(--danger),
                0 0 18px rgba(255, 59, 129, 0.6);
        }

        /* =========================================================
           BUTTON
           ========================================================= */

        .controls {
            margin-top: clamp(28px, 4vh, 46px);
            display: flex;
            justify-content: center;
        }

        .start-button {
            position: relative;
            min-width: min(330px, 80vw);
            padding: 17px 34px;
            border: 1px solid rgba(0, 234, 255, 0.65);
            border-radius: 2px;
            background:
                linear-gradient(
                    135deg,
                    rgba(0, 234, 255, 0.08),
                    rgba(62, 30, 140, 0.16)
                );
            color: #dfffff;
            font-family: inherit;
            font-size: clamp(0.68rem, 1.4vw, 0.85rem);
            font-weight: 700;
            letter-spacing: 0.2em;
            padding-left: calc(34px + 0.2em);
            cursor: pointer;
            overflow: hidden;
            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
            box-shadow:
                0 0 12px rgba(0, 234, 255, 0.18),
                inset 0 0 20px rgba(0, 234, 255, 0.025);
        }

        .start-button::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 3px;
            height: 100%;
            background: var(--cyan);
            box-shadow: 0 0 15px var(--cyan);
        }

        .start-button::after {
            content: "";
            position: absolute;
            top: 0;
            left: -120%;
            width: 80%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.12),
                transparent
            );
            transform: skewX(-25deg);
            transition: left 0.6s ease;
        }

        .start-button:hover {
            transform: translateY(-2px);
            border-color: rgba(0, 234, 255, 1);
            background:
                linear-gradient(
                    135deg,
                    rgba(0, 234, 255, 0.15),
                    rgba(80, 40, 180, 0.2)
                );
            box-shadow:
                0 0 20px rgba(0, 234, 255, 0.3),
                0 0 45px rgba(0, 100, 255, 0.12),
                inset 0 0 25px rgba(0, 234, 255, 0.05);
        }

        .start-button:hover::after {
            left: 130%;
        }

        .start-button:active {
            transform: translateY(1px) scale(0.985);
        }

        .start-button.reset {
            border-color: rgba(255, 100, 150, 0.45);
        }

        .start-button.reset::before {
            background: var(--purple);
            box-shadow: 0 0 15px var(--purple);
        }

        .start-button.again {
            border-color: rgba(54, 245, 160, 0.5);
        }

        .start-button.again::before {
            background: var(--green);
            box-shadow: 0 0 15px var(--green);
        }

        /* =========================================================
           CORNER CONTROLS
           ========================================================= */

        .utility-controls {
            position: fixed;
            right: 24px;
            bottom: 22px;
            display: flex;
            gap: 8px;
            z-index: 20;
        }

        .utility-button {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(0, 234, 255, 0.2);
            border-radius: 3px;
            background: rgba(3, 12, 22, 0.65);
            color: rgba(170, 235, 245, 0.65);
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition:
                color 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .utility-button:hover {
            color: var(--cyan);
            border-color: rgba(0, 234, 255, 0.65);
            box-shadow: 0 0 15px rgba(0, 234, 255, 0.16);
        }

        .utility-button svg {
            width: 17px;
            height: 17px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* =========================================================
           SMALL HUD DETAILS
           ========================================================= */

        .hud-corner {
            position: fixed;
            width: 80px;
            height: 80px;
            opacity: 0.5;
            pointer-events: none;
        }

        .hud-corner::before,
        .hud-corner::after {
            content: "";
            position: absolute;
            background: rgba(0, 234, 255, 0.45);
        }

        .hud-corner::before {
            width: 100%;
            height: 1px;
        }

        .hud-corner::after {
            width: 1px;
            height: 100%;
        }

        .hud-corner.tl {
            top: 25px;
            left: 25px;
        }

        .hud-corner.tr {
            top: 25px;
            right: 25px;
            transform: scaleX(-1);
        }

        .hud-corner.bl {
            bottom: 25px;
            left: 25px;
            transform: scaleY(-1);
        }

        .hud-corner.br {
            bottom: 25px;
            right: 25px;
            transform: scale(-1);
        }

        .hud-corner span {
            position: absolute;
            top: 8px;
            left: 8px;
            font-size: 6px;
            color: rgba(0, 234, 255, 0.5);
            letter-spacing: 1px;
        }

        /* =========================================================
           RESPONSIVE
           ========================================================= */

        @media (max-width: 700px) {
            :root {
                --timer-size: clamp(2.65rem, 13.5vw, 6rem);
            }

            .app {
                padding: 25px 14px 22px;
            }

            .brand-name {
                letter-spacing: 0.3em;
                padding-left: 0.3em;
            }

            .brand-tag {
                letter-spacing: 0.22em;
                padding-left: 0.22em;
            }

            .brand::before,
            .brand::after {
                width: 25px;
            }

            .brand::before {
                right: calc(100% + 10px);
            }

            .brand::after {
                left: calc(100% + 10px);
            }

            .timer-frame {
                width: 100%;
                padding: 35px 8px 42px;
            }

            .timer-frame::before,
            .timer-frame::after {
                width: 25px;
                height: 25px;
            }

            .hud-label {
                letter-spacing: 0.22em;
                padding-left: 0.22em;
            }

            .separator {
                margin: 0 5px;
            }

            .status {
                font-size: 0.57rem;
                letter-spacing: 0.17em;
                padding-left: 0.17em;
            }

            .utility-controls {
                right: 14px;
                bottom: 14px;
            }

            .hud-corner {
                width: 45px;
                height: 45px;
            }

            .hud-corner.tl {
                top: 15px;
                left: 15px;
            }

            .hud-corner.tr {
                top: 15px;
                right: 15px;
            }

            .hud-corner.bl {
                bottom: 15px;
                left: 15px;
            }

            .hud-corner.br {
                bottom: 15px;
                right: 15px;
            }
        }

        @media (max-width: 390px) {
            :root {
                --timer-size: 2.35rem;
            }

            .separator {
                margin: 0 3px;
            }

            .timer-frame {
                padding-left: 3px;
                padding-right: 3px;
            }

            .status-wrapper {
                gap: 7px;
            }

            .status {
                font-size: 0.48rem;
            }
        }

        @media (max-height: 600px) and (min-width: 701px) {
            .app {
                padding-top: 20px;
                padding-bottom: 15px;
            }

            .timer-frame {
                padding-top: 25px;
                padding-bottom: 28px;
            }

            .hud-label {
                margin-bottom: 12px;
            }

            .status-wrapper {
                margin-top: 16px;
            }

            .controls {
                margin-top: 18px;
            }

            .start-button {
                padding-top: 12px;
                padding-bottom: 12px;
            }
        }

        /* Accessibility */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================================
         BACKGROUND EFFECTS
         ========================================================= -->

    <div class="background" aria-hidden="true">
        <canvas id="particles"></canvas>

        <div class="grid"></div>

        <div class="orb one"></div>
        <div class="orb two"></div>
        <div class="orb three"></div>

        <div class="circuits">
            <div class="circuit c1"></div>
            <div class="circuit c2"></div>
            <div class="circuit c3"></div>
            <div class="circuit c4"></div>
        </div>

        <div class="scanlines"></div>
        <div class="vignette"></div>
    </div>

    <!-- Futuristic HUD corners -->
    <div class="hud-corner tl" aria-hidden="true"><span>01</span></div>
    <div class="hud-corner tr" aria-hidden="true"><span>02</span></div>
    <div class="hud-corner bl" aria-hidden="true"><span>03</span></div>
    <div class="hud-corner br" aria-hidden="true"><span>04</span></div>

    <!-- =========================================================
         MAIN APPLICATION
         ========================================================= -->

    <main class="app">

        <!-- AI IGNITE -->
        <header class="brand">
            <div class="brand-name">AI IGNITE</div>
            <div class="brand-tag">HACKATHON CONTROL SYSTEM</div>
        </header>

        <!-- TIMER -->
        <section class="timer-zone">

            <div class="timer-frame">

                <div class="hud-label">
                    24 HOUR COUNTDOWN // MISSION TIMER
                </div>

                <div
                    class="timer"
                    id="timer"
                    role="timer"
                    aria-live="polite"
                    aria-label="24 hours remaining"
                >
                    <span class="time-value" id="hours">24</span>
                    <span class="separator">:</span>
                    <span class="time-value" id="minutes">00</span>
                    <span class="separator">:</span>
                    <span class="time-value" id="seconds">00</span>
                </div>

                <!-- STATUS -->
                <div class="status-wrapper">
                    <span class="status-dot" id="statusDot"></span>
                    <div class="status" id="status">
                        READY TO START
                    </div>
                </div>

                <!-- START / RESET / AGAIN -->
                <div class="controls">
                    <button
                        class="start-button"
                        id="mainButton"
                        type="button"
                    >
                        START HACKATHON
                    </button>
                </div>

            </div>

        </section>

    </main>

    <!-- =========================================================
         UTILITY CONTROLS
         ========================================================= -->

    <div class="utility-controls">

        <!-- Sound -->
        <button
            class="utility-button"
            id="soundButton"
            type="button"
            aria-label="Enable timer sounds"
            title="Timer sounds"
        >
            <svg id="soundOnIcon" viewBox="0 0 24 24">
                <path d="M4 9v6h4l5 4V5L8 9H4z"></path>
                <path d="M16 9.5c1 1.4 1 3.6 0 5"></path>
                <path d="M18.5 7c2 2.7 2 6.3 0 9"></path>
            </svg>

            <svg
                id="soundOffIcon"
                viewBox="0 0 24 24"
                style="display:none;"
            >
                <path d="M4 9v6h4l5 4V5L8 9H4z"></path>
                <path d="M18 9l4 6"></path>
                <path d="M22 9l-4 6"></path>
            </svg>
        </button>

        <!-- Fullscreen -->
        <button
            class="utility-button"
            id="fullscreenButton"
            type="button"
            aria-label="Enter fullscreen"
            title="Fullscreen (F)"
        >
            <svg id="fullscreenIcon" viewBox="0 0 24 24">
                <path d="M8 3H3v5"></path>
                <path d="M16 3h5v5"></path>
                <path d="M21 16v5h-5"></path>
                <path d="M3 16v5h5"></path>
            </svg>
        </button>

    </div>

    <script>
        /* =========================================================
           AI IGNITE — TIMER ENGINE
           ========================================================= */

        const DURATION = 24 * 60 * 60 * 1000;
        const STORAGE_KEY = "aiIgniteTimerState";

        const hoursElement = document.getElementById("hours");
        const minutesElement = document.getElementById("minutes");
        const secondsElement = document.getElementById("seconds");

        const timerElement = document.getElementById("timer");
        const statusElement = document.getElementById("status");
        const statusDot = document.getElementById("statusDot");
        const mainButton = document.getElementById("mainButton");

        const soundButton = document.getElementById("soundButton");
        const soundOnIcon = document.getElementById("soundOnIcon");
        const soundOffIcon = document.getElementById("soundOffIcon");

        const fullscreenButton =
            document.getElementById("fullscreenButton");

        let endTimestamp = null;
        let animationFrame = null;
        let timerState = "ready";

        let soundEnabled = false;
        let audioContext = null;

        let lastSecondPlayed = null;

        /* =========================================================
           LOCAL STORAGE
           ========================================================= */

        function saveState(state, endTime = null) {
            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify({
                    state,
                    endTimestamp: endTime
                })
            );
        }

        function loadState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);

                if (!saved) {
                    return null;
                }

                return JSON.parse(saved);
            } catch (error) {
                console.warn("Unable to read saved timer state.", error);
                return null;
            }
        }

        function clearState() {
            localStorage.removeItem(STORAGE_KEY);
        }

        /* =========================================================
           TIMER DISPLAY
           ========================================================= */

        function pad(value) {
            return String(value).padStart(2, "0");
        }

        function displayTime(milliseconds) {
            const remaining = Math.max(0, milliseconds);

            const totalSeconds = Math.floor(remaining / 1000);

            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            hoursElement.textContent = pad(hours);
            minutesElement.textContent = pad(minutes);
            secondsElement.textContent = pad(seconds);

            timerElement.setAttribute(
                "aria-label",
                `${hours} hours, ${minutes} minutes, ${seconds} seconds remaining`
            );

            return {
                hours,
                minutes,
                seconds,
                totalSeconds
            };
        }

        /* =========================================================
           READY STATE
           ========================================================= */

        function setReadyState() {
            cancelAnimationFrame(animationFrame);

            timerState = "ready";
            endTimestamp = null;

            displayTime(DURATION);

            timerElement.classList.remove("running", "urgent");

            statusElement.textContent = "READY TO START";
            statusElement.classList.remove("completed");

            mainButton.textContent = "START HACKATHON";
            mainButton.className = "start-button";

            lastSecondPlayed = null;
        }

        /* =========================================================
           RUNNING STATE
           ========================================================= */

        function setRunningState(endTime) {
            endTimestamp = endTime;
            timerState = "running";

            timerElement.classList.add("running");
            timerElement.classList.remove("urgent");

            statusElement.textContent = "HACKATHON IN PROGRESS";
            statusElement.classList.remove("completed");

            mainButton.textContent = "RESET";
            mainButton.className = "start-button reset";

            updateTimer();
        }

        /* =========================================================
           COMPLETED STATE
           ========================================================= */

        function setCompletedState(playSound = false) {
            cancelAnimationFrame(animationFrame);

            timerState = "completed";
            endTimestamp = null;

            displayTime(0);

            timerElement.classList.remove("running");
            timerElement.classList.add("urgent");

            statusElement.textContent = "HACKATHON COMPLETED";
            statusElement.classList.add("completed");

            mainButton.textContent = "START AGAIN";
            mainButton.className = "start-button again";

            if (playSound) {
                playCompletionSound();
            }

            saveState("completed", null);
        }

        /* =========================================================
           START NEW 24-HOUR TIMER
           ========================================================= */

        function startTimer() {
            /*
             * IMPORTANT:
             * The timer uses an absolute timestamp rather than
             * decrementing a seconds variable.
             *
             * This prevents timer drift when the browser throttles
             * JavaScript while the tab is inactive.
             */

            const startTimestamp = Date.now();

            endTimestamp = startTimestamp + DURATION;

            saveState("running", endTimestamp);

            lastSecondPlayed = null;

            initializeAudio();

            setRunningState(endTimestamp);
        }

        /* =========================================================
           RESET TIMER
           ========================================================= */

        function resetTimer() {
            clearState();
            setReadyState();
        }

        /* =========================================================
           TIMER UPDATE LOOP
           ========================================================= */

        function updateTimer() {
            if (timerState !== "running" || !endTimestamp) {
                return;
            }

            /*
             * Absolute timestamp calculation.
             *
             * We NEVER do:
             * seconds--;
             *
             * Instead, every frame calculates the true remaining
             * duration from the saved end timestamp.
             */

            const now = Date.now();

            const remaining = Math.max(
                0,
                endTimestamp - now
            );

            const time = displayTime(remaining);

            /*
             * Final 10-second visual warning.
             */
            if (
                remaining > 0 &&
                remaining <= 10000
            ) {
                timerElement.classList.add("urgent");

                /*
                 * Play one optional beep per second.
                 */
                if (
                    soundEnabled &&
                    time.totalSeconds !== lastSecondPlayed
                ) {
                    lastSecondPlayed = time.totalSeconds;
                    playCountdownBeep(time.totalSeconds);
                }
            } else {
                timerElement.classList.remove("urgent");
            }

            /*
             * Reached exactly zero.
             */
            if (remaining <= 0) {
                setCompletedState(true);
                return;
            }

            /*
             * requestAnimationFrame provides smooth visual updates,
             * while Date.now() guarantees accurate elapsed time.
             */
            animationFrame = requestAnimationFrame(updateTimer);
        }

        /* =========================================================
           RECOVER TIMER AFTER PAGE REFRESH
           ========================================================= */

        function restoreTimer() {
            const saved = loadState();

            if (!saved) {
                setReadyState();
                return;
            }

            if (
                saved.state === "running" &&
                typeof saved.endTimestamp === "number"
            ) {
                const remaining =
                    saved.endTimestamp - Date.now();

                if (remaining > 0) {
                    setRunningState(saved.endTimestamp);
                } else {
                    setCompletedState(false);
                }

                return;
            }

            if (saved.state === "completed") {
                setCompletedState(false);
                return;
            }

            setReadyState();
        }

        /* =========================================================
           MAIN BUTTON
           ========================================================= */

        mainButton.addEventListener("click", () => {
            if (timerState === "ready") {
                startTimer();
                return;
            }

            if (timerState === "running") {
                resetTimer();
                return;
            }

            if (timerState === "completed") {
                startTimer();
            }
        });

        /* =========================================================
           AUDIO SYSTEM
           ========================================================= */

        function initializeAudio() {
            if (!audioContext) {
                const AudioContext =
                    window.AudioContext ||
                    window.webkitAudioContext;

                if (!AudioContext) {
                    return;
                }

                audioContext = new AudioContext();
            }

            if (audioContext.state === "suspended") {
                audioContext.resume();
            }
        }

        function playTone(
            frequency,
            duration = 0.08,
            volume = 0.035,
            type = "sine"
        ) {
            if (!soundEnabled || !audioContext) {
                return;
            }

            if (audioContext.state === "suspended") {
                audioContext.resume();
            }

            const oscillator =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();

            oscillator.type = type;
            oscillator.frequency.setValueAtTime(
                frequency,
                audioContext.currentTime
            );

            gain.gain.setValueAtTime(
                0,
                audioContext.currentTime
            );

            gain.gain.linearRampToValueAtTime(
                volume,
                audioContext.currentTime + 0.008
            );

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                audioContext.currentTime + duration
            );

            oscillator.connect(gain);
            gain.connect(audioContext.destination);

            oscillator.start();

            oscillator.stop(
                audioContext.currentTime + duration + 0.02
            );
        }

        function playCountdownBeep(second) {
            /*
             * Slightly higher pitch as the countdown approaches zero.
             */
            const frequency =
                500 + (10 - second) * 35;

            playTone(
                frequency,
                0.09,
                0.045,
                "square"
            );
        }

        function playCompletionSound() {
            if (!soundEnabled) {
                return;
            }

            initializeAudio();

            if (!audioContext) {
                return;
            }

            const now = audioContext.currentTime;

            const notes = [
                {
                    frequency: 523.25,
                    start: 0,
                    duration: 0.16
                },
                {
                    frequency: 659.25,
                    start: 0.18,
                    duration: 0.16
                },
                {
                    frequency: 783.99,
                    start: 0.36,
                    duration: 0.28
                }
            ];

            notes.forEach(note => {
                const oscillator =
                    audioContext.createOscillator();

                const gain =
                    audioContext.createGain();

                oscillator.type = "sine";
                oscillator.frequency.setValueAtTime(
                    note.frequency,
                    now + note.start
                );

                gain.gain.setValueAtTime(
                    0,
                    now + note.start
                );

                gain.gain.linearRampToValueAtTime(
                    0.06,
                    now + note.start + 0.02
                );

                gain.gain.exponentialRampToValueAtTime(
                    0.001,
                    now +
                    note.start +
                    note.duration
                );

                oscillator.connect(gain);
                gain.connect(audioContext.destination);

                oscillator.start(now + note.start);
                oscillator.stop(
                    now +
                    note.start +
                    note.duration +
                    0.03
                );
            });
        }

        /* =========================================================
           SOUND BUTTON
           ========================================================= */

        soundButton.addEventListener("click", () => {
            soundEnabled = !soundEnabled;

            if (soundEnabled) {
                initializeAudio();

                soundOnIcon.style.display = "block";
                soundOffIcon.style.display = "none";

                soundButton.setAttribute(
                    "aria-label",
                    "Mute timer sounds"
                );

                /*
                 * Small confirmation tone after user interaction.
                 */
                playTone(700, 0.08, 0.035);
            } else {
                soundOnIcon.style.display = "none";
                soundOffIcon.style.display = "block";

                soundButton.setAttribute(
                    "aria-label",
                    "Enable timer sounds"
                );
            }
        });

        /* =========================================================
           FULLSCREEN
           ========================================================= */

        async function toggleFullscreen() {
            try {
                if (!document.fullscreenElement) {
                    await document.documentElement.requestFullscreen();
                } else {
                    await document.exitFullscreen();
                }
            } catch (error) {
                console.warn(
                    "Fullscreen request was not permitted.",
                    error
                );
            }
        }

        fullscreenButton.addEventListener(
            "click",
            toggleFullscreen
        );

        document.addEventListener(
            "fullscreenchange",
            () => {
                fullscreenButton.setAttribute(
                    "aria-label",
                    document.fullscreenElement
                        ? "Exit fullscreen"
                        : "Enter fullscreen"
                );
            }
        );

        /* Keyboard shortcut: F */
        document.addEventListener("keydown", event => {
            const target = event.target;

            if (
                target instanceof HTMLInputElement ||
                target instanceof HTMLTextAreaElement ||
                target instanceof HTMLButtonElement
            ) {
                return;
            }

            if (
                event.key.toLowerCase() === "f"
            ) {
                event.preventDefault();
                toggleFullscreen();
            }
        });

        /* =========================================================
           PARTICLE BACKGROUND
           ========================================================= */

        const canvas =
            document.getElementById("particles");

        const ctx = canvas.getContext("2d");

        let particles = [];
        let particleAnimation;

        function resizeCanvas() {
            const pixelRatio =
                Math.min(window.devicePixelRatio || 1, 2);

            canvas.width =
                window.innerWidth * pixelRatio;

            canvas.height =
                window.innerHeight * pixelRatio;

            canvas.style.width =
                window.innerWidth + "px";

            canvas.style.height =
                window.innerHeight + "px";

            ctx.setTransform(
                pixelRatio,
                0,
                0,
                pixelRatio,
                0,
                0
            );

            createParticles();
        }

        function createParticles() {
            const density =
                window.innerWidth < 700
                    ? 35
                    : 75;

            particles = [];

            for (let i = 0; i < density; i++) {
                particles.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    radius: Math.random() * 1.4 + 0.25,
                    speed: Math.random() * 0.18 + 0.035,
                    drift:
                        (Math.random() - 0.5) *
                        0.12,
                    alpha:
                        Math.random() * 0.45 + 0.08,
                    phase:
                        Math.random() * Math.PI * 2
                });
            }
        }

        function drawParticles(time) {
            ctx.clearRect(
                0,
                0,
                window.innerWidth,
                window.innerHeight
            );

            particles.forEach(particle => {
                particle.y -= particle.speed;
                particle.x += particle.drift;

                if (particle.y < -10) {
                    particle.y =
                        window.innerHeight + 10;

                    particle.x =
                        Math.random() *
                        window.innerWidth;
                }

                if (particle.x < -10) {
                    particle.x =
                        window.innerWidth + 10;
                }

                if (particle.x >
                    window.innerWidth + 10) {
                    particle.x = -10;
                }

                const pulse =
                    Math.sin(
                        time * 0.001 +
                        particle.phase
                    ) * 0.18;

                const alpha = Math.max(
                    0.03,
                    particle.alpha + pulse
                );

                ctx.beginPath();

                ctx.arc(
                    particle.x,
                    particle.y,
                    particle.radius,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle =
                    `rgba(0, 220, 255, ${alpha})`;

                ctx.shadowBlur = 7;
                ctx.shadowColor =
                    "rgba(0, 220, 255, 0.7)";

                ctx.fill();

                ctx.shadowBlur = 0;
            });

            particleAnimation =
                requestAnimationFrame(drawParticles);
        }

        window.addEventListener(
            "resize",
            resizeCanvas
        );

        resizeCanvas();

        particleAnimation =
            requestAnimationFrame(drawParticles);

        /* =========================================================
           PAGE VISIBILITY
           ========================================================= */

        /*
         * When returning to the tab, immediately calculate the
         * remaining time again from Date.now().
         *
         * This is another layer of protection against browser
         * background-tab throttling.
         */

        document.addEventListener(
            "visibilitychange",
            () => {
                if (
                    !document.hidden &&
                    timerState === "running"
                ) {
                    cancelAnimationFrame(
                        animationFrame
                    );

                    updateTimer();
                }
            }
        );

        /* =========================================================
           INITIALIZE
           ========================================================= */

        restoreTimer();
    </script>

</body>
</html>
